name: Deploy to TestFlight

on:
  # Uncomment to enable a nightly build
  # schedule:
  #   - cron: '0 2 * * 1-5' # run on weekdays at 2 AM UTC

  # Show a manual trigger button in the GitHub Actions UI
  workflow_dispatch:

  # Trigger on pushes to release branches
  push:
    branches:
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: TemplateApp.xcodeproj
  SCHEME: TemplateApp
  ARCHIVE_PATH: TemplateApp.xcarchive
  EXPORT_OPTIONS_PLIST_PATH: ExportOptions.plist

jobs:
  build:
    name: Deploy to TestFlight
    # To use the self-hosted runner, change to `runs-on: [self-hosted, macOS]`
    runs-on: [xcode-27]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Read Xcode version
      id: xcode-version
      run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ steps.xcode-version.outputs.version }}

    - name: Trust Xcode package plugins and macros
      run: |
        defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
        defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

    # Uncomment when using Cocoapods (legacy). Don't forget to change the `-project` flag to `-workspace` in the xcodebuild commands below.
    # - name: Cache Cocoapods
    #   uses: actions/cache@v6
    #   id: cocoapods-cache
    #   with:
    #     path: Pods
    #     key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pods-

    # - name: Install Cocoapods
    #   if: steps.cocoapods-cache.outputs.cache-hit != 'true'
    #   run: |
    #     pod install

    - name: Cache Swift Package Manager dependencies
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install Swift packages
      run: |
        xcodebuild -project "${{ env.XCODE_PROJECT }}" \
          -scheme "${{ env.SCHEME }}" \
          -onlyUsePackageVersionsFromResolvedFile \
          -resolvePackageDependencies \
          -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages"

    - name: Install code signing certificate
      uses: q42/actions/install-certificate@v1
      with:
        build-certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        certificate-password: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}

    - name: Install App Store Connect API key
      id: app-store-connect-key
      run: |
        APP_STORE_CONNECT_API_KEY_PATH="${{ runner.temp }}/AuthKey.p8"
        echo "path=$APP_STORE_CONNECT_API_KEY_PATH" >> "$GITHUB_OUTPUT"
        echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode -o "$APP_STORE_CONNECT_API_KEY_PATH"

    - name: Archive build
      run: |
        xcodebuild clean archive \
          -project "${{ env.XCODE_PROJECT }}" \
          -scheme "${{ env.SCHEME }}" \
          -destination generic/platform=iOS \
          -archivePath "${{ runner.temp }}/${{ env.ARCHIVE_PATH }}" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "${{ steps.app-store-connect-key.outputs.path }}" \
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
          -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
          -disableAutomaticPackageResolution \
          CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
          GIT_COMMIT_HASH="$(git rev-parse HEAD)"

    - name: Write Export Options file
      run: |
        cat << EOF > ${{ env.EXPORT_OPTIONS_PLIST_PATH }}
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
        </plist>
        EOF

    - name: Upload to TestFlight
      run: |
        xcodebuild -exportArchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "${{ steps.app-store-connect-key.outputs.path }}" \
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
          -archivePath "${{ runner.temp }}/${{ env.ARCHIVE_PATH }}" \
          -exportPath ${{ env.ARCHIVE_PATH }} \
          -exportOptionsPlist ${{ env.EXPORT_OPTIONS_PLIST_PATH }}

    # Uncomment when using Firebase Crashlytics
    # - name: Upload dSYM files to Firebase Crashlytics
    #   uses: q42/actions/upload-symbols-to-firebase@v1
    #   with:
    #     source-packages-path: ${{ runner.temp }}/SourcePackages
    #     google-service-info-plist: ${{ matrix.environment.firebase_plist }}
    #     archive-path: ${{ runner.temp }}/${{ env.ARCHIVE_PATH }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.SCHEME }}-${{ github.sha }}.xcarchive
        path: ${{ runner.temp }}/${{ env.ARCHIVE_PATH }}
